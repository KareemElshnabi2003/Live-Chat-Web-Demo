name: live_chat
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: 
  cached_network_image: 
  url_launcher: ^6.3.2 
  google_fonts:
  flutter_otp_text_field: 
  shared_preferences: 
  dartz: 
  dotted_border: ^2.1.0
  webview_flutter: 
  screen_go:
  carousel_slider: 
  iconsax_plus: 
  lucide_icons_flutter:
  just_audio:
  flutter_localizations:
    sdk: flutter
  intl: 
  pusher_channels_flutter: ^2.5.0
  firebase_core: 
  firebase_messaging: 
  flutter_html: ^3.0.0-beta.2
  dio: ^5.9.0
  uuid: ^4.6.0
  connectivity_plus: ^7.3.1
  swipe_to: ^1.0.6
  shimmer: ^4.0.0
  flutter_bloc: ^8.1.6
  get_it: ^7.7.0
  go_router: ^14.6.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons:
  
flutter_intl:
  enabled: true
  class_name: S
  main_locale: ar
  arb_dir: lib/l10n
  output_dir: lib/generated
 
flutter:
  uses-material-design: true
  generate: true

  assets:
    - lib/Images/
    - assets/past_live.mp3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/Images/play_store_512.png"

dependency_overrides:
  html: 0.15.1